<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="./assets/mocha tab.ico" />

    <link rel="stylesheet" href="style.css" />

    <title>Home</title>
  </head>

  <body>
    <div class="container">
      <div class="search-box">
        <input id="search" placeholder="Search..." autocomplete="off" />
      </div>

      <h3 class="section-title">Favourites</h3>
      <div id="links" class="links"></div>
      <h3 class="section-title">Local</h3>
      <div id="local-links" class="links"></div>
    </div>

    <div class="hint-container">
      <div class="hint-block">
        <ul>
          <li><span>g: </span> <span>Google</span></li>
          <li><span>gi:</span> <span>Google Images</span></li>
          <li><span>gm:</span> <span>Google Maps</span></li>
          <li><span>d: </span> <span>DuckDuckgo</span></li>
          <li><span>di:</span> <span>DuckDuckgo Images</span></li>
          <li><span>npm:</span> <span>Node Package manager</span></li>
          <li><span>yt:</span> <span>YouTube</span></li>
          <li><span>r: </span> <span>Reddit</span></li>
          <li><span>c: </span> <span>Claude</span></li>
          <li><span>gh:</span> <span>Github</span></li>
        </ul>
      </div>
      <span class="hint"></span>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
